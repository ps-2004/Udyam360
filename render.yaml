services:
  - type: web
    name: udyam360-backend
    runtime: python
    plan: free
    buildCommand: "apt-get update && apt-get install -y tesseract-ocr poppler-utils && pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://udyam360-frontend.onrender.com"
      - key: UPLOAD_DIR
        value: "/var/data/kyc"
    disk:
      name: udyam360-uploads
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: udyam360-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://udyam360-backend.onrender.com"
